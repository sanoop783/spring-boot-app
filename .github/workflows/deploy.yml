name: Java CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/app"
          strip_components: 1
          overwrite: true

      - name: Restart App on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Fix permissions in case root created the folder
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /home/ec2-user/app
            
            cd /home/ec2-user/app
            
            # 2. Kill existing java process
            sudo pkill -f java || true
            
            # 3. Start the app
            # Using 'disown' and 'sleep' prevents the 143 termination error
            nohup java -jar *.war > app.log 2>&1 &
            
            # 4. Give the app time to initialize
            sleep 10
            
            # 5. Output the last few lines of the log to verify it started
            echo "--- Application Logs ---"
            tail -n 20 app.log
            
            echo "Deployment complete."
