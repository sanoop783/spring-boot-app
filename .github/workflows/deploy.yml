name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        # We ensure the JAR is built. 
        # Note: If your project is a multi-module project, the JAR might be in a subfolder!
        run: mvn clean package -DskipTests

      - name: Verify Build Output (Debug)
        # This step confirms the file exists before SCP tries to grab it
        run: ls -l target/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Use a more specific pattern to avoid 'plain' jars if possible
          source: "target/*.jar"
          target: "/home/ec2-user/app"
          strip_components: 1
          rm: true

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app || exit
            
            # 1. Stop the existing app (Port 8080)
            sudo fuser -k 8080/tcp || true
            
            # 2. Identify the correct JAR (Avoiding the -plain.jar if it exists)
            # This finds the largest JAR, which is usually the executable one
            APP_JAR=$(ls -S *.jar | head -1)
            
            # 3. Run the application
            noh)up java -jar "$APP_JAR" > app.log 2>&1 &
            
            # 4. Give it a moment to start and check if it's running
            sleep 5
            ps aux | grep java
