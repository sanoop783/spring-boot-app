name: Spring Boot CI/CD (WAR) to EC2
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Locate WAR and Verify
        run: |
          # Finding the .war file now
          WAR_PATH=$(find . -path "*/target/*.war" ! -name "*plain.war" | head -n 1)
          if [ -z "$WAR_PATH" ]; then
            echo "::error::No WAR file found!"
            exit 1
          fi
          echo "Found WAR at: $WAR_PATH"

      - name: Copy WAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Ensure this is looking for .war
          source: "target/*.war" 
          target: "/home/ec2-user/app"
          # Since source is "target/*.war", strip_components: 1 
          # will remove the "target/" prefix on the remote server
          strip_components: 1
          rm: true

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app || exit
            sudo fuser -k 8080/tcp || true
            
            # Look for the .war file specifically
            APP_WAR=$(ls -S *.war | grep -v "plain" | head -1)
            
            # Executable WARs run exactly like JARs
            nohup java -jar "$APP_WAR" > app.log 2>&1 &
            
            sleep 5
            ps aux | grep java | grep -v grep
