name: Java CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: List target directory
        run: ls -R target/

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/app"
          strip_components: 1
          overwrite: true
          debug: true  # Added to see connection details

      - name: Restart App on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          debug: true # Added to see connection details
          script: |
            mkdir -p /home/ec2-user/app
            cd /home/ec2-user/app
            # Kill existing java process if running
            sudo pkill -f java || true
            # Clean up old logs
            rm -f app.log
            # Run the new WAR file in the background
            nohup java -jar *.war > app.log 2>&1 &
            echo "Deployment complete. App is starting..."
