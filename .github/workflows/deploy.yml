name: Spring Boot CI/CD (WAR) to EC2
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Locate WAR and Verify
        run: |
          WAR_PATH=$(find . -path "*/target/*.war" ! -name "*plain.war" | head -n 1)
          if [ -z "$WAR_PATH" ]; then
            echo "::error::No WAR file found!"
            exit 1
          fi
          echo "Found WAR at: $WAR_PATH"

      # REPLACED appleboy/scp-action with Debugging SCP
      - name: Debug Connection and Copy
        run: |
          echo "${{ secrets.EC2_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          
          # Create target directory first to avoid errors
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p /home/ec2-user/app"
          
          # Verbose copy
          scp -v -o StrictHostKeyChecking=no -i private_key.pem target/springboot-hello-0.0.1-SNAPSHOT.war ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ec2-user/app/
          
          rm private_key.pem

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          command_timeout: 5m
          script: |
            cd /home/ec2-user/app || exit
            sudo fuser -k 8080/tcp || true
            APP_WAR=$(ls -S *.war | grep -v "plain" | head -1)
            nohup java -jar "$APP_WAR" > app.log 2>&1 &
            sleep 5
            ps aux | grep java | grep -v grep
