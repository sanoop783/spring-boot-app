name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.jar"
          target: "/home/ec2-user/app"
          strip_components: 1
          # Removes old JARs before copying to prevent wildcard conflicts
          rm: true 

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Navigate and ensure script doesn't fail if dir is missing
            cd /home/ec2-user/app || exit
            
            # Kill the process running on port 8080 (more precise than pkill java)
            sudo fuser -k 8080/tcp || true
            
            # Clean up logs and old files
            rm -f app.log
            
            # Run the application
            # Using 'disown' ensures the process isn't killed when the SSH session ends
            nohup java -jar *.jar > app.log 2>&1 &
            disown
