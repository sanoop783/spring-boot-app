name: Java CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/app"
          strip_components: 1
          overwrite: true

      - name: Restart App on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Force fix permissions
            sudo chown -R ec2-user:ec2-user /home/ec2-user/app
            cd /home/ec2-user/app

            # 2. Kill old process
            sudo pkill -9 -f java || true

            # 3. Start the app (Detached subshell to prevent Signal 143/137)
            (nohup java -jar springboot-hello-0.0.1-SNAPSHOT.war > app.log 2>&1 &)
            
            # 4. Wait and Verify
            sleep 15
            disown -a
            
            if pgrep -f java > /dev/null; then
                echo "--- SUCCESS: App is running ---"
                tail -n 20 app.log
            else
                echo "--- FAILURE: App crashed on startup ---"
                [ -f app.log ] && cat app.log || echo "No log file found."
                exit 1
            fi
