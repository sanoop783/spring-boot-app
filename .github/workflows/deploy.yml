name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Verify Build Output
        # This prevents the SCP error by failing early if the file is missing
        run: |
          ls -l target/*.jar || (echo "No JAR found in target folder!" && exit 1)

      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.jar"
          target: "/home/ec2-user/app"
          strip_components: 1
          rm: true

      - name: Restart Application on EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app || exit
            
            # 1. Stop existing app (Port 8080)
            sudo fuser -k 8080/tcp || true
            
            # 2. Identify the largest JAR (ignores the -plain.jar if present)
            APP_JAR=$(ls -S *.jar | head -1)
            
            # 3. Clean logs and start application
            rm -f app.log
            nohup java -jar "$APP_JAR" > app.log 2>&1 &
            
            # 4. Success verification
            sleep 5
            ps aux | grep java | grep -v grep
