name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Verify Build Output
        # Uses 'find' to ensure we see JARs even in sub-modules
        run: |
          find . -path "*/target/*.jar" -ls || (echo "No JAR found!" && exit 1)

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # The glob pattern below finds JARs in any target folder
          source: "**/target/*.jar"
          target: "/home/ec2-user/app"
          # strip_components: 2 removes 'module-name/target/' from the path
          strip_components: 2 
          rm: true

      - name: Restart Application on EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/app || exit
            
            # 1. Stop existing app (Port 8080)
            sudo fuser -k 8080/tcp || true
            
            # 2. Identify the largest JAR (executable) and ignore -plain.jar
            APP_JAR=$(ls -S *.jar | grep -v "plain" | head -1)
            
            # 3. Clean logs and start application
            rm -f app.log
            nohup java -jar "$APP_JAR" > app.log 2>&1 &
            
            # 4. Verify process is running
            sleep 5
            ps aux | grep java | grep -v grep
