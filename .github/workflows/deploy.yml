name: Java CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.war"
          target: "/home/ec2-user/app"
          strip_components: 1
          overwrite: true

      - name: Restart App on AWS Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. Ensure directory exists and fix permissions
            sudo mkdir -p /home/${{ secrets.EC2_USER }}/app
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /home/${{ secrets.EC2_USER }}/app
            cd /home/${{ secrets.EC2_USER }}/app

            # 2. Kill any old java process (forceful kill to free port)
            sudo pkill -9 -f java || true

            # 3. Start the app in a detached subshell
            # The parentheses and & disown it from the current session
            (nohup java -jar *.war > app.log 2>&1 &)
            
            # 4. Wait for the app to initialize
            sleep 10
            disown -a
            
            # 5. Show logs to confirm success in GitHub console
            echo "--- Latest App Logs ---"
            if [ -f app.log ]; then
                tail -n 20 app.log
            else
                echo "Log file not found!"
            fi
            
            # 6. Final check: Is the process actually alive?
            if pgrep -f java > /dev/null; then
                echo "Deployment Successful! Java process is running."
                pgrep -fl java
            else
                echo "Deployment Failed! Java process is not running."
                exit 1
            fi
