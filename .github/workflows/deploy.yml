name: Spring Boot CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Use strip_components so the JAR doesn't end up inside a 'target' folder on the server
          source: "target/*.jar"
          target: "/home/ec2-user/app"
          strip_components: 1

      - name: Restart Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Navigate to app directory
            cd /home/ec2-user/app
            
            # Stop existing java process
            sudo pkill -f java || true
            
            # Wait a moment for the port to release
            sleep 2
            
            # Start the new application
            # We use a wildcard *.jar but ensure we point to the current directory
            nohup java -jar *.jar > app.log 2>&1 &
